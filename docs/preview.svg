<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="960" height="540" fill="#f8fafc"/>
  <!-- header -->
  <rect width="960" height="56" fill="#0f172a"/>
  <circle cx="28" cy="28" r="10" fill="#2563eb"/>
  <text x="48" y="34" fill="#ffffff" font-size="18" font-weight="700">Fintech Design System</text>
  <text x="930" y="34" fill="#94a3b8" font-size="13" text-anchor="end">Storybook 8 · light / dark</text>

  <!-- AccountCard -->
  <g transform="translate(24,84)">
    <rect width="280" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" fill="#64748b" font-size="13" font-weight="600">Everyday Checking</text>
    <rect x="180" y="20" width="80" height="22" rx="11" fill="#dcfce7"/>
    <circle cx="196" cy="31" r="3.5" fill="#16a34a"/>
    <text x="206" y="35" fill="#166534" font-size="11" font-weight="600">Active</text>
    <text x="20" y="74" fill="#0f172a" font-size="28" font-weight="700">$8,421.55</text>
    <text x="20" y="100" fill="#94a3b8" font-size="12">•••• 4821</text>
  </g>

  <!-- AccountCard 2 -->
  <g transform="translate(320,84)">
    <rect width="280" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" fill="#64748b" font-size="13" font-weight="600">High-Yield Savings</text>
    <rect x="190" y="20" width="70" height="22" rx="11" fill="#cffafe"/>
    <text x="200" y="35" fill="#0e7490" font-size="11" font-weight="600">4.30% APY</text>
    <text x="20" y="74" fill="#0f172a" font-size="28" font-weight="700">$42,100.00</text>
    <text x="20" y="100" fill="#94a3b8" font-size="12">•••• 7732</text>
  </g>

  <!-- Sparkline card -->
  <g transform="translate(616,84)">
    <rect width="320" height="120" rx="12" fill="#0f172a"/>
    <text x="20" y="34" fill="#94a3b8" font-size="13" font-weight="600">Portfolio · +3.2% today</text>
    <text x="20" y="66" fill="#ffffff" font-size="22" font-weight="700">$152,930.18</text>
    <path d="M20,104 L60,96 L100,100 L140,84 L180,88 L220,72 L260,64 L300,48" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="300" cy="48" r="3.5" fill="#60a5fa"/>
  </g>

  <!-- DataTable -->
  <g transform="translate(24,224)">
    <rect width="576" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">Portfolio holdings</text>
    <line x1="0" y1="46" x2="576" y2="46" stroke="#e2e8f0"/>
    <text x="20" y="66" fill="#64748b" font-size="12" font-weight="600">Symbol</text>
    <text x="120" y="66" fill="#64748b" font-size="12" font-weight="600">Name</text>
    <text x="400" y="66" fill="#64748b" font-size="12" font-weight="600" text-anchor="end">Price ▲</text>
    <text x="540" y="66" fill="#64748b" font-size="12" font-weight="600" text-anchor="end">Value</text>
    <g font-size="13" fill="#0f172a">
      <text x="20" y="94">AAPL</text><text x="120" y="94">Apple Inc.</text><text x="400" y="94" text-anchor="end">$212.40</text><text x="540" y="94" text-anchor="end">$10,620.00</text>
      <text x="20" y="120">MSFT</text><text x="120" y="120">Microsoft</text><text x="400" y="120" text-anchor="end">$451.10</text><text x="540" y="120" text-anchor="end">$9,022.00</text>
      <text x="20" y="146">NVDA</text><text x="120" y="146">NVIDIA</text><text x="400" y="146" text-anchor="end">$1,201.30</text><text x="540" y="146" text-anchor="end">$9,610.40</text>
    </g>
    <line x1="0" y1="104" x2="576" y2="104" stroke="#f1f5f9"/>
    <line x1="0" y1="130" x2="576" y2="130" stroke="#f1f5f9"/>
  </g>

  <!-- Stepper + buttons -->
  <g transform="translate(616,224)">
    <rect width="320" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">KYC onboarding</text>
    <!-- rail -->
    <circle cx="40" cy="64" r="12" fill="#2563eb"/><text x="40" y="68" fill="#fff" font-size="12" text-anchor="middle">✓</text>
    <line x1="52" y1="64" x2="148" y2="64" stroke="#2563eb" stroke-width="2"/>
    <circle cx="160" cy="64" r="12" fill="#2563eb"/><text x="160" y="68" fill="#fff" font-size="12" text-anchor="middle">2</text>
    <line x1="172" y1="64" x2="268" y2="64" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="280" cy="64" r="12" fill="#e2e8f0"/><text x="280" y="68" fill="#64748b" font-size="12" text-anchor="middle">3</text>
    <text x="40" y="92" fill="#64748b" font-size="10" text-anchor="middle">Identity</text>
    <text x="160" y="92" fill="#0f172a" font-size="10" text-anchor="middle" font-weight="600">Address</text>
    <text x="280" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">Review</text>
    <!-- buttons -->
    <rect x="20" y="124" width="84" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="62" y="147" fill="#475569" font-size="13" text-anchor="middle">Back</text>
    <rect x="216" y="124" width="84" height="36" rx="8" fill="#2563eb"/>
    <text x="258" y="147" fill="#ffffff" font-size="13" text-anchor="middle">Next</text>
  </g>

  <!-- transactions -->
  <g transform="translate(24,424)">
    <rect width="912" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">Recent transactions</text>
    <text x="20" y="58" fill="#0f172a" font-size="13">🛒  Whole Foods Market</text>
    <text x="20" y="78" fill="#94a3b8" font-size="11">Jun 21, 2026 · Groceries</text>
    <text x="430" y="58" fill="#dc2626" font-size="13" font-weight="600" text-anchor="end">-$86.42</text>
    <text x="520" y="58" fill="#0f172a" font-size="13">💼  Payroll — Acme Inc.</text>
    <text x="520" y="78" fill="#94a3b8" font-size="11">Jun 20, 2026 · Income</text>
    <text x="892" y="58" fill="#16a34a" font-size="13" font-weight="600" text-anchor="end">+$3,200.00</text>
  </g>
</svg>
