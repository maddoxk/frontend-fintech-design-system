name: Release and deploy Storybook

# On every merge to main: run tests, bump the package version (patch by default),
# commit and tag the bump, then rebuild and redeploy Storybook showing that version.
# A failing test run stops the workflow before any version bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a manual run
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the version-bump commit and tag
  pages: write
  id-token: write

# Serialize runs so two quick merges never race on the version bump.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync with latest main
        # Pull before testing so the tested commit is the one that is bumped,
        # tagged and deployed.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: Bump version, commit and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          # Never bump twice for a release commit, except on a manual run,
          # which always performs the requested bump.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && git log -1 --pretty=%s | grep -q '^chore(release):'; then
            echo "Latest commit is a release commit; skipping bump."
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          # One retry if a merge landed since checkout: fetch, rebase, push again.
          # A second failure aborts the job (set -e), so it stays loud.
          if ! git push origin main; then
            echo "Push rejected; fetching, rebasing and retrying once."
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
          # Tag after the push so the tag points at the commit that landed on main.
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /frontend-fintech-design-system/
          STORYBOOK_APP_VERSION: ${{ steps.bump.outputs.version }}
      - name: Add .nojekyll
        run: touch storybook-static/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
